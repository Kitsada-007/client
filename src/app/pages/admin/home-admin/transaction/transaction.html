<app-header-admin></app-header-admin>

<div class="text-light container">
  <div class="mb-3 text-center mt-5">
    จำนวนผู้ใช้งานเว็บไซต์: <strong>{{ users?.length || 0 }} คน</strong>
  </div>

  <div *ngIf="users?.length; else loading">
    <div *ngFor="let user of users" class="row bg-dark p-3 rounded mb-3">
      <!-- ฝั่งซ้าย -->
      <div class="col-md-6 border-end">
        <div class="d-flex align-items-center mb-2">
          <div class="me-3">
            <img [src]="user.profile_image || 'https://via.placeholder.com/50'" class="rounded-circle" width="50"
              height="50" alt="User Image" />
          </div>
          <div>
            <div><strong>User:</strong> {{ user.username }}</div>
            <div><strong>Email:</strong> {{ user.email }}</div>
          </div>
        </div>
      </div>

      <!-- ฝั่งขวา -->
      <div class="col-md-6 d-flex align-items-center justify-content-center">
        <a [routerLink]="['/historys/', user.id]" class="btn btn-primary">
          ประวัติทำธุรกรรมผู้ใช้
        </a>
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2 me-4">
    <button mat-button [matMenuTriggerFor]="userMenu" style="background-color: rgb(41, 44, 49); border-radius: 5px;">
      <img [src]="users?.profile_image || 'assets/Images/user.png'" alt="avatar" width="40" height="32"
           style="border-radius: 5px; margin-right: 8px;">
      <span style="color: #1e88e5; margin-right: 8px;">{{admin?.username}}</span>
      <mat-icon style="color: #1e88e5;">keyboard_arrow_down</mat-icon>
    </button>
  </div>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item>
      <span routerLink="/profile-admin">ดูโปรไฟล์ของฉัน</span>
    </button>
    <hr>
    <button mat-menu-item>
      <span (click)="logout()">ออกจากบัญชี</span>
    </button>
  </mat-menu>
</mat-toolbar>

<!-- ส่วนเนื้อหาหลัก -->
 
  <ng-template #loading>
    <p class="text-center mt-5">กำลังโหลดข้อมูล...</p>
  </ng-template>
</div>
