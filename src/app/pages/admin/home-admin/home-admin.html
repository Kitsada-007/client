
<mat-toolbar
    class="toolbar d-flex justify-content-between align-items-center px-3"
    color="primary">

    <!-- กลุ่มซ้าย: โลโก้ + ปุ่มลูกศร (วางแนวตั้ง) -->
    <div class="d-flex flex-column align-items-start">
        <!-- โลโก้ -->
        <img src="assets/Images/logo.png" alt="logo" width="75px" class="mb-2">

        <!-- ปุ่มลูกศร + ลิงก์ -->
        <div class="d-flex align-items-center gap-3">
            <button mat-icon-button>
                <mat-icon
                    style="color: rgba(143, 152, 160, 1);">arrow_back</mat-icon>
            </button>
            <button mat-icon-button>
                <mat-icon
                    style="color: rgba(143, 152, 160, 1);">arrow_forward</mat-icon>
            </button>

            <a class="text-white">ข้อมูลเกมทั้งหมด</a>
            <a class="text-white">ประวัติทำธุระกรรมผู้ใช้</a>
            <a class="text-white">สร้างโค้ดส่วนลด</a>
        </div>
    </div>

</mat-toolbar>

<div class="container my-5 text-white">
    <div class="card mx-auto p-4 shadow-lg"
        style="max-width: 700px; background-color: rgba(23, 29, 37, 1); border: none;">
        <h4 class="text-center mb-4 fw-bold">เพิ่มเกมใหม่ๆ</h4>

        <form [formGroup]="gameForm" (ngSubmit)="submitGame()">
            <div class="mb-3">
                <label class="form-label">ชื่อเกม</label>
                <input type="text" class="form-control text-white border-0"
                    formControlName="name">
            </div>

            <div class="mb-3">
                <label class="form-label">ราคา</label>
                <input type="number" class="form-control text-white border-0"
                    formControlName="price">
            </div>

            <div class="mb-3">
                <label class="form-label">ประเภท</label>
                <input type="text" class="form-control text-white border-0"
                    formControlName="genre">
            </div>

            <div class="mb-3">
                <label class="form-label">รายละเอียด</label>
                <textarea class="form-control text-white border-0" rows="4"
                    formControlName="description"></textarea>
            </div>

            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary px-4">
                    {{ editingGameId ? 'บันทึกการแก้ไข' : 'เพิ่มเกมใหม่' }}
                </button>

                <!-- ปุ่มยกเลิก -->
                <button
                    type="button"
                    class="btn btn-secondary px-4 ms-2"
                    *ngIf="editingGameId"
                    (click)="cancelEdit()">
                    ยกเลิก
                </button>
            </div>

        </form>
    </div>
</div>

<div class="container mt-5 text-white">
    <h5 class="fw-bold mb-3">รายการเกมทั้งหมด</h5>

    <!-- แสดงสถานะโหลด -->
    <div *ngIf="loading" class="text-center my-4">
        <div class="spinner-border text-light" role="status"></div>
        <p class="mt-2">กำลังโหลดข้อมูล...</p>
    </div>

    <!-- ตารางรายการเกม -->
    <div *ngIf="!loading" class="table-responsive">
        <table
            class="table table-dark table-bordered align-middle text-center"
            style="background-color: #1b263b;">
            <thead>
                <tr>
                    <th>รูป</th>
                    <th>ชื่อเกม</th>
                    <th>ประเภท</th>
                    <th>ราคา</th>
                    <th>รายละเอียด</th>
                    <th>วันที่ขาย</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let game of games">
                    <td>
                        <img [src] alt="cover"
                            style="width:70px; height:70px; object-fit:cover; border-radius:5px;">
                    </td>
                    <td>{{ game.name }}</td>
                    <td>{{ game.genre }}</td>
                    <td>{{ game.price }}</td>
                    <td
                        style="max-width:250px; white-space:pre-wrap; text-align:left;">
                        {{ game.description }}
                    </td>
                    <td>{{ formatThaiDate(game.release_date) }}</td>

                    <td>
                        <button
                            class="btn btn-primary btn-sm me-2"
                            (click)="editGame(game)">
                            แก้ไข
                        </button>

                        <button (click)="removeGame(game)"
                            class="btn btn-danger btn-sm">ลบ</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
