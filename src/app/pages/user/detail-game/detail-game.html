<div class="container my-4 text-white d-flex justify-content-center">
  <div class="game-detail-wrapper w-100" style="max-width: 900px;">
    
    <!-- ชื่อเกม -->
    <h2 class="mb-3">{{ game?.name }}</h2>

    <div class="row">
      <!-- ภาพหลักและ gallery -->
      <div class="col-md-7">
        <div class="card mb-3 bg-dark text-white">
          <img [src]="" class="card-img-top" alt="Game Image">
        </div>

        <div class="d-flex gap-2 overflow-auto mb-3">
          <!-- <img *ngFor="let img of game?." [src]="img" class="img-thumbnail" style="height: 80px; cursor: pointer;"> -->
        </div>
      </div>

      <!-- รายละเอียดเกม -->
      <div class="col-md-5">
        <div class="card bg-dark text-white p-3">
          <p>{{ game?.name }}</p>
          <p><strong>วันที่วางจำหน่าย:</strong></p>
          <p><strong>อันดับขาย:</strong></p>
          <p><strong>ประเภทเกม:</strong> 
            <span *ngFor="let type of game?.genre" class="badge bg-secondary me-1">{{ type }}</span>
          </p>
        </div>
      </div>
    </div>

    <!-- ซื้อเกม -->
    <div class="mt-3 p-3 bg-dark d-flex justify-content-between align-items-center rounded">
      <h5>สั่งซื้อ {{ game?.name }}</h5>
      <div class="d-flex gap-2">
        <div class="p-2 bg-black">{{ game?.price }} บาท</div>
        <button class="btn btn-success">หยิบใส่รถเข็น</button>
      </div>
    </div>

  </div>
</div>
