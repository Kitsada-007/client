<mat-toolbar
    class="toolbar d-flex justify-content-between align-items-center px-3"
    color="primary">

    <!-- กลุ่มซ้าย: โลโก้ + ปุ่มลูกศร (วางแนวตั้ง) -->
    <div class="d-flex flex-column align-items-start">
        <!-- โลโก้ -->
        <img src="assets/Images/logo.png" alt="logo" width="75px" class="mb-2">

        <!-- ปุ่มลูกศร + ลิงก์ -->
        <div class="d-flex align-items-center gap-3">
            <button mat-icon-button>
                <mat-icon
                    style="color: rgba(143, 152, 160, 1);">arrow_back</mat-icon>
            </button>
            <button mat-icon-button>
                <mat-icon
                    style="color: rgba(143, 152, 160, 1);">arrow_forward</mat-icon>
            </button>

            <a class="text-white" routerLink
                style="text-decoration: none;">ร้านค้า</a>
            <a class="text-white" routerLink="/collection"
                style="text-decoration: none;">คลัง</a>
        </div>
    </div>

    <!-- กลุ่มขวา: User Dropdown -->
    <div class="d-flex align-items-center gap-2 me-4">
        <button mat-button [matMenuTriggerFor]="userMenu"
            style="background-color: rgba(39, 45, 55, 1); border-radius: 5px;">
            <img [src]="user?.profile_image || 'assets/Images/user.png'"
                alt="avatar" width="40" height="32"
                style="border-radius: 5px; margin-right: 8px;">
            <span style="color: #1e88e5; margin-right: 8px;">User</span>
            <mat-icon style="color: #1e88e5;">keyboard_arrow_down</mat-icon>
        </button>

    </div>

</mat-toolbar>

<!-- Dropdown Menu -->
<mat-menu #userMenu="matMenu">
    <button mat-menu-item>

        <span routerLink="/profile">ดูโปรไฟล์ของฉัน</span>
    </button>
    <button mat-menu-item>

        <span routerLink="/wallet">ดูวอเล็ตของฉัน</span>
    </button>
    <button mat-menu-item>

        <span>ประวัติการทำรายการ</span>
    </button>
    <hr>
    <button mat-menu-item>

        <span (click)="logout()">ออกจากบัญชี</span>
    </button>
</mat-menu>
<!-- แถบค้นหา -->
<div class="d-flex justify-content-center w-100 py-2">
    <div class="d-flex align-items-center w-75" style="max-width: 900px;">

        <!-- ปุ่มหมวดหมู่ -->
        <button mat-button [matMenuTriggerFor]="CategoryMenu"
            class="d-flex align-items-center px-3"
            style="background-color: transparent; color: white; min-width: 120px;">
            <span style="margin-right: 8px;">หมวดหมู่</span>
            <mat-icon style="color: white;">keyboard_arrow_down</mat-icon>
        </button>

        <!-- ช่องค้นหา -->
        <div class="d-flex align-items-center flex-grow-1 mx-2"
            style="background-color: rgba(59, 70, 84, 1); border-radius: 5px; height: 40px;">
            <input type="text" placeholder="ค้นหาในร้านค้า"
                class="form-control border-0 text-white custom-placeholder"
                style="background-color: transparent; box-shadow: none;" />
            <button mat-icon-button
                style="color: white; background-color: rgba(38, 130, 255, 1); border-radius: 1px;">
                <mat-icon>search</mat-icon>
            </button>
        </div>

        <!-- ปุ่มรถเข็น -->
        <button routerLink="/shopping" mat-raised-button
            style="color: aliceblue; background-color: rgba(38, 130, 255, 1); border-radius: 5px; margin-left: 8px; min-width: 90px; height: 40px;">
            รถเข็น
        </button>
    </div>
</div>

<!-- Dropdown Menu -->
<mat-menu #CategoryMenu="matMenu">
    <button mat-menu-item><span>แอ็คชั่น</span></button>
    <button mat-menu-item><span>ผจญภัย</span></button>
    <button mat-menu-item><span>กีฬา</span></button>
    <button mat-menu-item><span>กลยุทธ์</span></button>
</mat-menu>
<!-- content ด้านล่าง-->
